name: Build Linux AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-linux:
    name: Build & Verify Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: learnharness-linux-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.AppImage
